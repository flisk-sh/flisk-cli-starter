# Builds an app with the TDK CLI, starts it with tdk up on a GitHub Actions runner,
# checks the health endpoint, and uploads a screenshot of the running service.
name: Build app with TDK on CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tdk-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TDK CLI
        run: npm install -g @tdk-landscape/tdk-cli-core@1.3.185

      - name: Install Tilt
        run: |
          curl -fsSL -o tilt.tgz https://github.com/tilt-dev/tilt/releases/download/v0.37.8/tilt.0.37.8.linux.x86_64.tar.gz
          echo "e39513f958705d30524d55f68b1d46fbef2b46a0da568efd00e6383dee6be44f  tilt.tgz" | sha256sum -c -
          sudo tar -xzf tilt.tgz -C /usr/local/bin tilt
          rm -f tilt.tgz

      - name: Create the app
        run: |
          mkdir shop && cd shop
          tdk project --yes
          tdk resource orders-api --type backend --stack shop --yes

      - name: Start the stack with tdk up
        working-directory: shop
        run: |
          nohup tdk up shop > up.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://api.shop.localhost/api/orders/health; then exit 0; fi
            sleep 5
          done
          echo "Service did not become healthy"; tail -200 up.log; exit 1

      - name: Install browser for screenshot
        run: npx -y playwright@1.47.2 install --with-deps chromium

      - name: Screenshot the running service
        working-directory: shop
        run: npx -y playwright@1.47.2 screenshot --wait-for-timeout=2000 http://api.shop.localhost/api/orders/health running-service.png

      - name: Job summary
        run: |
          {
            echo "## TDK app is running"
            echo '```'
            curl -s http://api.shop.localhost/api/orders/health
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdk-up-evidence
          path: |
            shop/running-service.png
            shop/up.log
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        working-directory: shop
        run: tdk down || true
