# Builds an app with the Flisk CLI, starts it with flisk up on a GitHub Actions runner,
# checks the health endpoint, and uploads a screenshot of the running service.
name: Build app with Flisk on CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flisk-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install Flisk CLI
        run: npm install -g @flisk-sh/flisk@1.3.190

      - name: Install Tilt
        run: |
          curl -fsSL -o tilt.tgz https://github.com/tilt-dev/tilt/releases/download/v0.37.8/tilt.0.37.8.linux.x86_64.tar.gz
          echo "e39513f958705d30524d55f68b1d46fbef2b46a0da568efd00e6383dee6be44f  tilt.tgz" | sha256sum -c -
          sudo tar -xzf tilt.tgz -C /usr/local/bin tilt
          rm -f tilt.tgz

      - name: Create the app
        run: |
          mkdir shop && cd shop
          flisk project --yes
          flisk resource orders-api --type backend --stack shop --yes

      - name: Start the stack with flisk up
        working-directory: shop
        run: |
          flisk up shop > up.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; flisk down >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 90); do
            grep -q 'Running tilt up' up.log && break
            if ! kill -0 "$pid" 2>/dev/null; then tail -200 up.log; exit 1; fi
            sleep 2
          done
          # The routed URL is the one the stack published, not the port the service
          # listens on inside its container: Traefik picks the host port.
          awk '/Starting [0-9]+ service/{found=1} /Running tilt up/{found=0} found' up.log \
            | grep -oE 'https?://[^ ]+' | sort -u > urls.txt || true
          grep -E '^https?://api\.' urls.txt > backend-urls.txt || true
          if [ ! -s backend-urls.txt ]; then
            tail -200 up.log
            echo 'flisk up did not report a backend URL' >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "$(head -1 backend-urls.txt)"; then exit 0; fi
            sleep 5
          done
          echo "Service did not become healthy"; tail -200 up.log; exit 1

      - name: Install browser for screenshot
        run: npx -y playwright@1.47.2 install --with-deps chromium

      - name: Screenshot the running service
        working-directory: shop
        run: npx -y playwright@1.47.2 screenshot --wait-for-timeout=2000 "$(head -1 backend-urls.txt)" running-service.png

      - name: Job summary
        working-directory: shop
        run: |
          {
            echo "## Flisk app is running"
            echo '```'
            curl -s "$(head -1 backend-urls.txt)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flisk-up-evidence
          path: |
            shop/running-service.png
            shop/up.log
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        working-directory: shop
        run: flisk down || true
